<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <rect width="960" height="440" rx="24" fill="#FFFFFF" />
  <rect x="24" y="24" width="912" height="392" rx="18" fill="#F3F4F6" />

  <text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">
    Paleta de Referência — Modern Explainer
  </text>
  <text x="56" y="100" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4B5563">
    Proporção indicativa: 60% Neutro · 25% Dominante · 10% Secundárias · 5% Destaque
  </text>

  <!-- Swatch Cards -->
  <g transform="translate(56, 128)">
    <rect x="0" y="0" width="156" height="156" rx="16" fill="#2457D6" />
    <text x="14" y="182" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Azul (Dominante)</text>
    <text x="14" y="202" font-family="monospace" font-size="13" fill="#4B5563">#2457D6</text>

    <rect x="173" y="0" width="156" height="156" rx="16" fill="#FFB84D" />
    <text x="187" y="182" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Âmbar (Destaque)</text>
    <text x="187" y="202" font-family="monospace" font-size="13" fill="#4B5563">#FFB84D</text>

    <rect x="346" y="0" width="156" height="156" rx="16" fill="#F16D5B" />
    <text x="360" y="182" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Coral (Secundária)</text>
    <text x="360" y="202" font-family="monospace" font-size="13" fill="#4B5563">#F16D5B</text>

    <rect x="519" y="0" width="156" height="156" rx="16" fill="#63B98B" />
    <text x="533" y="182" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Verde (Secundária)</text>
    <text x="533" y="202" font-family="monospace" font-size="13" fill="#4B5563">#63B98B</text>

    <rect x="692" y="0" width="156" height="156" rx="16" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" />
    <text x="706" y="182" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Neutro (Base)</text>
    <text x="706" y="202" font-family="monospace" font-size="13" fill="#4B5563">#F3F4F6</text>
  </g>

  <!-- 60 / 25 / 10 / 5 Proportion Bar -->
  <g transform="translate(56, 356)">
    <rect x="0" y="0" width="508.8" height="28" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
    <rect x="512.8" y="0" width="212" height="28" rx="6" fill="#2457D6" />
    <rect x="728.8" y="0" width="40.4" height="28" rx="6" fill="#F16D5B" />
    <rect x="773.2" y="0" width="40.4" height="28" rx="6" fill="#63B98B" />
    <rect x="817.6" y="0" width="30.4" height="28" rx="6" fill="#FFB84D" />

    <text x="12" y="19" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">60% Neutro</text>
    <text x="524" y="19" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">25% Dominante</text>
    <text x="734" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">10%</text>
    <text x="822" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#111827">5%</text>
